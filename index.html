<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #17171c;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
            width: 320px;
        }
        .display {
            width: 100%;
            height: 80px;
            background-color: #17171c;
            border: none;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: #2e2f38;
            color: #ffffff;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:active {
            transform: scale(0.95);
        }
        button.operator {
            background-color: #ff9f0a;
            color: white;
        }
        button.operator:hover {
            background-color: #cc7f08;
        }
        button.function {
            background-color: #4e505f;
            color: white;
        }
        button.equal {
            background-color: #ff9f0a;
            color: white;
        }
        button.zero {
            grid-column: span 2;
            border-radius: 30px;
            aspect-ratio: auto;
            justify-content: flex-start;
            padding-left: 30px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" class="display" id="screen" readonly value="0">
    <div class="buttons">
        <button class="function" onclick="clearScreen()">C</button>
        <button class="function" onclick="backspace()">⌫</button>
        <button class="function" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button onclick="appendValue('0')" class="zero">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const screen = document.getElementById('screen');

    function appendValue(value) {
        if (screen.value === '0' && value !== '.') {
            screen.value = value;
        } else {
            screen.value += value;
        }
    }

    function clearScreen() {
        screen.value = '0';
    }

    function backspace() {
        if (screen.value.length > 1) {
            screen.value = screen.value.slice(0, -1);
        } else {
            screen.value = '0';
        }
    }

    function calculate() {
        try {
            let expression = screen.value;
            // Percentage logic handle karne ke liye (e.g., 500*10% -> 500*10/100)
            expression = expression.replace(/%/g, '/100');
            
            let result = eval(expression);
            screen.value = result;
        } catch (error) {
            screen.value = 'Error';
        }
    }
</script>

</body>
</html>
